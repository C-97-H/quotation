<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统报价单</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: "SimSun", "Songti SC", "Times New Roman", serif;
            margin: 0;
            padding: 0;
            user-select: none; /* 避免拖拽时误选文字 */
        }
        .a4-paper {
            width: 210mm;
            min-height: 280mm; 
            margin: 20px auto;
            background-color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 15mm 15mm; 
            box-sizing: border-box;
            position: relative;
        }
        
        /* 表格线宽与边框 */
        .box-table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed; /* 固定布局便于精准拖拽列宽 */
        }
        .box-table th, .box-table td {
            border: 1px solid #666666 !important; 
            position: relative;
            overflow: hidden;
        }

        input, textarea {
            background-color: transparent;
            color: #000;
            user-select: text;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* 印章支持鼠标按住拖拽 */
        .realistic-stamp {
            mix-blend-mode: multiply;
            cursor: move;
            user-select: none;
            position: absolute;
            z-index: 30;
        }

        /* Excel 风格的列宽/行高拖拽手柄 */
        .col-resizer {
            position: absolute;
            top: 0;
            right: -3px;
            width: 6px;
            height: 100%;
            cursor: col-resize;
            z-index: 40;
        }
        .col-resizer:hover, .col-resizer.resizing {
            background-color: #3b82f6;
        }

        .row-resizer {
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100%;
            height: 6px;
            cursor: row-resize;
            z-index: 40;
        }
        .row-resizer:hover, .row-resizer.resizing {
            background-color: #3b82f6;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            body { background: white; margin: 0; padding: 0; }
            .no-print, .col-resizer, .row-resizer { display: none !important; }
            input::placeholder, textarea::placeholder { color: transparent !important; }
            .a4-paper { box-shadow: none; margin: 0; width: 100%; min-height: 100%; padding: 10mm; }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>
<body class="text-gray-900 bg-gray-100">

    <!-- 顶部固定操作栏 (高度 60px) -->
    <div class="no-print fixed top-0 w-full h-[60px] bg-gray-800 z-50 shadow-md flex items-center justify-between px-6">
        <div class="flex items-center gap-3">
            <h1 class="text-white font-bold text-base tracking-widest mr-2">报价单生成系统</h1>
            <div class="flex bg-gray-700 rounded overflow-hidden shadow-sm">
                <button id="btn-company-sanheyi" onclick="switchCompany('sanheyi')" class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition border-r border-indigo-800">
                    三合一 (专票)
                </button>
                <button id="btn-company-huixinfa" onclick="switchCompany('huixinfa')" class="px-3 py-1.5 bg-slate-600 text-white text-xs font-bold hover:bg-slate-500 transition">
                    惠新发 (普票)
                </button>
            </div>
            <span class="text-xs text-amber-300 bg-amber-950/60 px-2.5 py-1 rounded border border-amber-700/50 flex items-center">
                💡 鼠标可直接拉动边框调节列宽/行高，按住公章可拖拽位置
            </span>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="openParseModal()" class="px-3 py-1.5 bg-fuchsia-600 text-white text-xs font-bold rounded shadow-sm hover:bg-fuchsia-700 transition flex items-center">
                <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                识别需方资料
            </button>
            <button onclick="manualSaveQuote()" class="px-4 py-1.5 bg-amber-600 text-white text-xs font-bold rounded shadow-sm hover:bg-amber-700 transition flex items-center">
                保存报价
            </button>
            <button onclick="window.print()" class="px-4 py-1.5 bg-green-600 text-white text-xs font-bold rounded shadow-sm hover:bg-green-700 transition flex items-center">
                直接打印
            </button>
            <button onclick="downloadPDF()" id="pdf-btn" class="px-4 py-1.5 bg-blue-600 text-white text-xs font-bold rounded shadow-sm hover:bg-blue-700 transition flex items-center">
                下载 PDF
            </button>
        </div>
    </div>

    <!-- 左侧边栏 (客户库 + 历史报价) -->
    <aside class="no-print fixed left-0 top-[60px] bottom-0 w-[280px] bg-white shadow-[4px_0_24px_rgba(0,0,0,0.04)] border-r border-gray-200 z-40 flex flex-col">
        <div class="flex border-b border-gray-200 bg-gray-50 text-xs font-bold">
            <button id="tab-clients-btn" onclick="switchSidebarTab('clients')" class="flex-1 py-3 text-center text-indigo-600 border-b-2 border-indigo-600 bg-white transition">
                客户库 (<span id="history-count">0</span>)
            </button>
            <button id="tab-contracts-btn" onclick="switchSidebarTab('contracts')" class="flex-1 py-3 text-center text-gray-500 hover:text-indigo-600 transition border-b-2 border-transparent">
                历史报价 (<span id="contract-count">0</span>)
            </button>
        </div>
        
        <div class="p-3 border-b border-gray-100">
            <div class="relative">
                <input type="text" id="sidebar-search" oninput="handleSidebarSearch()" placeholder="搜索需方名称或报价编号..." class="w-full bg-gray-100 text-xs rounded-md pl-8 pr-3 py-2 focus:outline-none focus:ring-1 focus:ring-indigo-400 focus:bg-white transition">
                <svg class="w-4 h-4 text-gray-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <div id="sidebar-clients-view" class="flex-1 overflow-y-auto p-3 space-y-2 bg-gray-50/50"></div>
        <div id="sidebar-contracts-view" class="flex-1 overflow-y-auto p-3 space-y-2 bg-gray-50/50 hidden"></div>

        <div class="p-4 border-t border-gray-100 bg-white shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
            <button onclick="openParseModal()" class="w-full py-2.5 bg-fuchsia-50 text-fuchsia-600 border border-fuchsia-200 rounded-lg text-xs font-bold hover:bg-fuchsia-600 hover:text-white transition shadow-sm flex justify-center items-center group">
                <svg class="w-4 h-4 mr-1.5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                粘贴新需方资料
            </button>
        </div>
    </aside>

    <!-- 右侧报价单主区域 -->
    <main class="ml-[280px] pt-[60px] pb-10 print:ml-0 print:pt-0 print:pb-0">
        <div id="quote-content" class="a4-paper flex flex-col bg-white">
            
            <h1 class="text-3xl font-bold text-center tracking-[1em] mb-4">报 价 单</h1>

            <!-- 日期与编号 -->
            <div class="flex justify-between text-[13px] mb-2 font-bold">
                <div class="flex items-end">
                    <span>日期：</span>
                    <input type="text" id="quote-date" class="border-b border-gray-500 w-36 focus:outline-none text-blue-800 text-center pb-0.5">
                </div>
                <div class="flex items-end">
                    <span>编号：</span>
                    <input type="text" id="quote-no" class="border-b border-gray-500 w-44 focus:outline-none text-blue-800 text-center pb-0.5">
                </div>
            </div>

            <!-- 核心报价表格 (支持 Excel 拖拽列宽/行高) -->
            <table id="quote-table" class="box-table text-[12px] text-center w-full relative">
                <thead>
                    <tr class="bg-gray-50 font-bold h-8">
                        <th style="width: 45px;">编号</th>
                        <th style="width: 160px;">名称</th>
                        <th style="width: 65px;">代号</th>
                        <th style="width: 80px;">规格</th>
                        <th style="width: 65px;">材质</th>
                        <th style="width: 55px;">数量</th>
                        <th style="width: 85px;" class="text-red-600 leading-tight" id="th-price">含税13%<br>单价</th>
                        <th style="width: 85px;">合计</th>
                        <th style="width: 60px;">备注</th>
                    </tr>
                </thead>
                
                <tbody id="product-tbody">
                    <!-- JS 动态增减行 -->
                </tbody>

                <tbody class="text-left">
                    <!-- 固定补充说明行 -->
                    <tr class="h-7">
                        <td class="text-center font-bold" id="bottom-note-index">13</td>
                        <td colspan="8" class="px-2">
                            <div class="flex items-center w-full">
                                <span class="font-bold">注：</span>
                                <input type="text" id="bottom-note-text" class="flex-1 focus:outline-none bg-transparent hover:bg-gray-50 focus:bg-yellow-50 transition px-1" placeholder="请在此输入补充说明 (可选)...">
                            </div>
                        </td>
                    </tr>
                    <!-- 人民币合计行 -->
                    <tr class="h-8 font-bold">
                        <td colspan="9" class="px-2">
                            人民币合计：<span id="grand-total-cn" class="text-blue-800">零元整</span>
                            <input type="text" id="grand-total-num" class="w-32 focus:outline-none text-blue-800 text-right ml-2" readonly tabindex="-1">
                        </td>
                    </tr>
                </tbody>

                <!-- 供需双方信息 -->
                <tbody class="text-left text-[12px] leading-snug">
                    <tr>
                        <td colspan="4" class="w-1/2 px-2 py-1 align-top relative z-0">
                            <div class="flex"><span class="w-16">供方：</span><input type="text" id="partyA_name" class="flex-1 focus:outline-none font-bold"></div>
                        </td>
                        <td colspan="5" class="w-1/2 px-2 py-1 align-top">
                            <div class="flex"><span class="w-16">需方：</span><input type="text" id="partyB_name" class="flex-1 focus:outline-none font-bold text-blue-800" placeholder="请填写或在左侧选择需方"></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="px-2 py-1 align-top z-0 relative">
                            <div class="flex"><span class="w-[4.5rem]">公司税号：</span><input type="text" id="partyA_tax" class="flex-1 focus:outline-none"></div>
                        </td>
                        <td colspan="5" class="px-2 py-1 align-top">
                            <div class="flex"><span class="w-[4.5rem]">公司税号：</span><input type="text" id="partyB_tax" class="flex-1 focus:outline-none"></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="px-2 py-1 align-top z-0 relative">
                            <div class="flex"><span class="w-[4.5rem]">开户行：</span><input type="text" id="partyA_bank" class="flex-1 focus:outline-none"></div>
                        </td>
                        <td colspan="5" class="px-2 py-1 align-top">
                            <div class="flex"><span class="w-[4.5rem]">开户行：</span><input type="text" id="partyB_bank" class="flex-1 focus:outline-none"></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="px-2 py-1 align-top z-0 relative">
                            <div class="flex"><span class="w-[4.5rem]">公司帐号：</span><input type="text" id="partyA_account" class="flex-1 focus:outline-none"></div>
                        </td>
                        <td colspan="5" class="px-2 py-1 align-top">
                            <div class="flex"><span class="w-[4.5rem]">公司帐号：</span><input type="text" id="partyB_account" class="flex-1 focus:outline-none"></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="px-2 py-1 align-top z-0 relative">
                            <div class="flex"><span class="w-[4.5rem]">联系人：</span><input type="text" id="partyA_agent" class="flex-1 focus:outline-none"></div>
                        </td>
                        <td colspan="5" class="px-2 py-1 align-top">
                            <div class="flex"><span class="w-[4.5rem]">联系人：</span><input type="text" id="partyB_agent" class="flex-1 focus:outline-none"></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="px-2 py-1 align-top z-0 relative">
                            <div class="flex items-start"><span class="w-[4.5rem] mt-[1px]">公司地址：</span><textarea id="partyA_address" rows="1" oninput="adjustTextareaHeight(this)" class="flex-1 focus:outline-none resize-none overflow-hidden p-0 bg-transparent"></textarea></div>
                        </td>
                        <td colspan="5" class="px-2 py-1 align-top">
                            <div class="flex items-start"><span class="w-[4.5rem] mt-[1px]">公司地址：</span><textarea id="partyB_address" rows="1" oninput="adjustTextareaHeight(this)" class="flex-1 focus:outline-none resize-none overflow-hidden p-0 bg-transparent"></textarea></div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 可鼠标自由按住拖拽的公章 -->
            <img id="partyA_seal" src="./shy.png" class="realistic-stamp w-[170px] h-[170px] opacity-95" style="left: 480px; top: 620px;" alt="公章" onerror="this.style.display='none'">

        </div>
    </main>

    <!-- 弹窗：智能识别需方 -->
    <div id="parse-modal" class="fixed inset-0 z-50 bg-black/60 hidden items-center justify-center no-print backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-[90%] max-w-lg flex flex-col">
            <div class="px-5 py-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h3 class="text-base font-bold text-gray-800">智能识别需方(乙方)资料</h3>
                <button onclick="closeParseModal()" class="text-gray-400 hover:text-red-500"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="p-4">
                <textarea id="parse-textarea" rows="6" class="w-full border border-gray-300 rounded p-3 text-xs focus:outline-none focus:border-fuchsia-500" placeholder="请在此粘贴客户开票资料..."></textarea>
            </div>
            <div class="px-4 py-3 border-t bg-gray-50 rounded-b-xl flex justify-end gap-3">
                <button onclick="closeParseModal()" class="px-4 py-2 border rounded-lg text-gray-600 bg-white hover:bg-gray-100 text-xs">取消</button>
                <button onclick="executeParse()" class="px-4 py-2 bg-fuchsia-600 text-white rounded-lg hover:bg-fuchsia-700 text-xs font-bold shadow-md">一键识别填入</button>
            </div>
        </div>
    </div>

    <script>
        function adjustTextareaHeight(el) {
            el.style.height = '18px'; 
            el.style.height = el.scrollHeight + 'px'; 
        }

        let currentCompanyType = 'sanheyi';

        // ================= 1. 供方配置 =================
        const companyData = {
            sanheyi: {
                name: '深圳市三合一五金有限公司',
                tax: '91440300306115994W',
                bank: '中国工商银行深圳双龙支行',
                account: '4000020609201024351',
                agent: '蔡国贵 13824361177',
                address: '深圳市龙岗区高科大道56号万达科技园1号厂房',
                priceHeaderHtml: '含13%税<br>单价',
                showSeal: true,
                sealSrc: './shy.png'
            },
            huixinfa: {
                name: '深圳市龙岗区惠新发五金钢材商行',
                tax: '92440300L375629906',
                bank: '深圳农村商业银行南约支行',
                account: '000106704608',
                agent: '蔡国贵 13824361177',
                address: '深圳市龙岗区宝龙街道高科大道万达科技园56号1号厂房',
                priceHeaderHtml: '单价',
                showSeal: true,
                sealSrc: './hxf.png'
            }
        };

        function switchCompany(type) {
            currentCompanyType = type;
            const data = companyData[type];

            const btnSanheyi = document.getElementById('btn-company-sanheyi');
            const btnHuixinfa = document.getElementById('btn-company-huixinfa');
            if (type === 'sanheyi') {
                btnSanheyi.className = 'px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition border-r border-indigo-800';
                btnHuixinfa.className = 'px-3 py-1.5 bg-slate-600 text-white text-xs font-bold hover:bg-slate-500 transition';
            } else {
                btnHuixinfa.className = 'px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition';
                btnSanheyi.className = 'px-3 py-1.5 bg-slate-600 text-white text-xs font-bold hover:bg-slate-500 transition border-r border-indigo-800';
            }

            document.getElementById('partyA_name').value = data.name;
            document.getElementById('partyA_tax').value = data.tax;
            document.getElementById('partyA_bank').value = data.bank;
            document.getElementById('partyA_account').value = data.account;
            document.getElementById('partyA_agent').value = data.agent;
            
            const addrEl = document.getElementById('partyA_address');
            addrEl.value = data.address;
            setTimeout(() => adjustTextareaHeight(addrEl), 0);
            
            document.getElementById('th-price').innerHTML = data.priceHeaderHtml;
            
            const sealImg = document.getElementById('partyA_seal');
            if (data.showSeal) {
                sealImg.src = data.sealSrc;
                sealImg.style.display = 'block';
            } else {
                sealImg.style.display = 'none';
            }
        }

        // ================= 2. Excel 风格：鼠标按住拉动列宽 & 行高 & 拖拽公章 =================
        function initExcelDragFeatures() {
            const table = document.getElementById('quote-table');

            // A. 初始化列宽拖拽 (Header Column Resizer)
            const headers = table.querySelectorAll('thead th');
            headers.forEach((th) => {
                const resizer = document.createElement('div');
                resizer.className = 'col-resizer no-print';
                th.appendChild(resizer);

                let startX = 0, startWidth = 0;

                resizer.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    startX = e.clientX;
                    startWidth = th.offsetWidth;
                    resizer.classList.add('resizing');

                    const onMouseMove = (moveEvent) => {
                        const newWidth = startWidth + (moveEvent.clientX - startX);
                        if (newWidth > 25) {
                            th.style.width = `${newWidth}px`;
                        }
                    };

                    const onMouseUp = () => {
                        resizer.classList.remove('resizing');
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    };

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            });

            // B. 初始化公章自由鼠标拖拽
            initStampDrag();
        }

        // 动态给表格每行挂载行高拖拽手柄
        function attachRowResizer(tr) {
            let resizer = tr.querySelector('.row-resizer');
            if (!resizer) {
                resizer = document.createElement('div');
                resizer.className = 'row-resizer no-print';
                tr.appendChild(resizer);

                let startY = 0, startHeight = 0;

                resizer.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    startY = e.clientY;
                    startHeight = tr.offsetHeight;
                    resizer.classList.add('resizing');

                    const onMouseMove = (moveEvent) => {
                        const newHeight = startHeight + (moveEvent.clientY - startY);
                        if (newHeight > 20) {
                            tr.style.height = `${newHeight}px`;
                        }
                    };

                    const onMouseUp = () => {
                        resizer.classList.remove('resizing');
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    };

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            }
        }

        // 公章自由鼠标拖动函数
        function initStampDrag() {
            const seal = document.getElementById('partyA_seal');
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            seal.addEventListener('mousedown', (e) => {
                e.preventDefault();
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = seal.offsetLeft;
                initialTop = seal.offsetTop;

                const onMouseMove = (moveEvent) => {
                    if (!isDragging) return;
                    const dx = moveEvent.clientX - startX;
                    const dy = moveEvent.clientY - startY;
                    seal.style.left = `${initialLeft + dx}px`;
                    seal.style.top = `${initialTop + dy}px`;
                };

                const onMouseUp = () => {
                    isDragging = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        window.onload = function() {
            switchCompany('sanheyi'); 
            
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hour = String(now.getHours()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('quote-date').value = `${year}年${month}月${day}日`;
            document.getElementById('quote-no').value = `BJ${year}${month}${day}${hour}${minute}`;

            // 初始化生成 12 行空白明细
            for(let i=0; i<12; i++){
                insertRowHTML(document.getElementById('product-tbody'), 'prod');
            }
            updateRowIndices();

            // 挂载所有拖拽处理逻辑
            initExcelDragFeatures();

            renderSavedClients();
            renderSavedContracts();
        };

        // ================= 3. 侧边栏 Tab 控制与检索 =================
        let activeTab = 'clients';

        function switchSidebarTab(tab) {
            activeTab = tab;
            const clientsBtn = document.getElementById('tab-clients-btn');
            const contractsBtn = document.getElementById('tab-contracts-btn');
            const clientsView = document.getElementById('sidebar-clients-view');
            const contractsView = document.getElementById('sidebar-contracts-view');

            if (tab === 'clients') {
                clientsBtn.className = 'flex-1 py-3 text-center text-indigo-600 border-b-2 border-indigo-600 bg-white transition';
                contractsBtn.className = 'flex-1 py-3 text-center text-gray-500 hover:text-indigo-600 transition border-b-2 border-transparent';
                clientsView.classList.remove('hidden');
                contractsView.classList.add('hidden');
            } else {
                contractsBtn.className = 'flex-1 py-3 text-center text-indigo-600 border-b-2 border-indigo-600 bg-white transition';
                clientsBtn.className = 'flex-1 py-3 text-center text-gray-500 hover:text-indigo-600 transition border-b-2 border-transparent';
                contractsView.classList.remove('hidden');
                clientsView.classList.add('hidden');
            }
            handleSidebarSearch();
        }

        function handleSidebarSearch() {
            const query = document.getElementById('sidebar-search').value.trim();
            if (activeTab === 'clients') {
                renderSavedClients(query);
            } else {
                renderSavedContracts(query);
            }
        }

        // ================= 4. 需方客户库管理 =================
        let savedClients = JSON.parse(localStorage.getItem('contract_clients') || '{}');

        function renderSavedClients(keyword = '') {
            const container = document.getElementById('sidebar-clients-view');
            const countBadge = document.getElementById('history-count');
            container.innerHTML = '';
            
            let names = Object.keys(savedClients).reverse();
            countBadge.innerText = names.length;

            if (keyword) {
                names = names.filter(n => n.toLowerCase().includes(keyword.toLowerCase()));
            }

            if(names.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center h-40 text-gray-400"><p class="text-xs">暂无符合的客户</p></div>`;
                return;
            }
            
            names.forEach(name => {
                const data = savedClients[name];
                const card = document.createElement('div');
                card.className = 'group relative p-3 bg-white border border-gray-100 rounded-lg cursor-pointer hover:-translate-y-0.5 hover:shadow-md hover:border-indigo-200 transition-all duration-200';
                card.onclick = () => fillClient(name);

                const title = document.createElement('h4');
                title.className = 'text-[13px] font-bold text-gray-800 pr-7 truncate';
                title.innerText = name;

                const sub = document.createElement('p');
                sub.className = 'text-[11px] text-gray-500 mt-1 truncate';
                sub.innerText = data.tax ? `税号: ${data.tax}` : (data.agent ? `联系人: ${data.agent}` : '暂无更多信息');

                const delBtn = document.createElement('button');
                delBtn.className = 'absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity rounded-md hover:bg-red-50 focus:outline-none';
                delBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
                delBtn.onclick = (e) => {
                    e.stopPropagation(); 
                    if(confirm(`确定要删除历史客户【${name}】吗？`)) {
                        delete savedClients[name];
                        localStorage.setItem('contract_clients', JSON.stringify(savedClients));
                        renderSavedClients(document.getElementById('sidebar-search').value);
                    }
                };

                card.appendChild(title);
                card.appendChild(sub);
                card.appendChild(delBtn);
                container.appendChild(card);
            });
        }

        function saveCurrentClient() {
            const name = document.getElementById('partyB_name').value.trim();
            if(!name) return;
            const client = {
                name: name,
                tax: document.getElementById('partyB_tax').value.trim(),
                bank: document.getElementById('partyB_bank').value.trim(),
                account: document.getElementById('partyB_account').value.trim(),
                address: document.getElementById('partyB_address').value.trim(),
                agent: document.getElementById('partyB_agent').value.trim()
            };
            savedClients[name] = client;
            localStorage.setItem('contract_clients', JSON.stringify(savedClients));
            renderSavedClients();
        }

        function fillClient(name) {
            const data = savedClients[name];
            if(!data) return;
            document.getElementById('partyB_name').value = data.name || '';
            document.getElementById('partyB_tax').value = data.tax || '';
            document.getElementById('partyB_bank').value = data.bank || '';
            document.getElementById('partyB_account').value = data.account || '';
            
            const addrEl = document.getElementById('partyB_address');
            addrEl.value = data.address || '';
            adjustTextareaHeight(addrEl);

            document.getElementById('partyB_agent').value = data.agent || '';
        }

        // ================= 5. 历史报价单保存与恢复 =================
        let savedQuotes = JSON.parse(localStorage.getItem('quote_records') || '{}');

        function saveCurrentQuote() {
            saveCurrentClient();

            const quoteNo = document.getElementById('quote-no').value.trim();
            if (!quoteNo) return;

            const items = [];
            document.querySelectorAll('#product-tbody .item-row').forEach(row => {
                if (row.classList.contains('prod-row')) {
                    const inputs = row.querySelectorAll('input');
                    const name = inputs[0].value.trim();
                    const qty = inputs[4].value;
                    const price = inputs[5].value;
                    if (name || qty || price) {
                        items.push({
                            type: 'prod',
                            name: inputs[0].value,
                            code: inputs[1].value,
                            spec: inputs[2].value,
                            material: inputs[3].value,
                            qty: inputs[4].value,
                            price: inputs[5].value ? parseFloat(inputs[5].value).toFixed(2) : '',
                            total: inputs[6].value,
                            remark: inputs[7].value
                        });
                    }
                } else if (row.classList.contains('note-row')) {
                    const noteInp = row.querySelector('.note-input');
                    if (noteInp && noteInp.value.trim()) {
                        items.push({ type: 'note', content: noteInp.value });
                    }
                }
            });

            const seal = document.getElementById('partyA_seal');

            const quoteRecord = {
                quoteNo: quoteNo,
                companyType: currentCompanyType,
                quoteDate: document.getElementById('quote-date').value,
                bottomNote: document.getElementById('bottom-note-text').value,
                partyB: {
                    name: document.getElementById('partyB_name').value,
                    tax: document.getElementById('partyB_tax').value,
                    bank: document.getElementById('partyB_bank').value,
                    account: document.getElementById('partyB_account').value,
                    address: document.getElementById('partyB_address').value,
                    agent: document.getElementById('partyB_agent').value,
                },
                sealPos: {
                    left: seal.style.left,
                    top: seal.style.top
                },
                items: items,
                updatedAt: new Date().toLocaleString('zh-CN', { hour12: false })
            };

            savedQuotes[quoteNo] = quoteRecord;
            localStorage.setItem('quote_records', JSON.stringify(savedQuotes));
            renderSavedContracts();
        }

        function manualSaveQuote() {
            saveCurrentQuote();
            alert('✅ 当前报价单已保存在左侧【历史报价】中！点击随时可加载修改。');
        }

        function renderSavedContracts(keyword = '') {
            const container = document.getElementById('sidebar-contracts-view');
            const countBadge = document.getElementById('contract-count');
            container.innerHTML = '';

            let nos = Object.keys(savedQuotes).reverse();
            countBadge.innerText = nos.length;

            if (keyword) {
                nos = nos.filter(no => {
                    const c = savedQuotes[no];
                    return no.includes(keyword) || (c.partyB && c.partyB.name.toLowerCase().includes(keyword.toLowerCase()));
                });
            }

            if (nos.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center h-40 text-gray-400"><p class="text-xs">暂无符合的历史报价</p></div>`;
                return;
            }

            nos.forEach(no => {
                const quote = savedQuotes[no];
                const card = document.createElement('div');
                card.className = 'group relative p-3 bg-white border border-gray-100 rounded-lg cursor-pointer hover:-translate-y-0.5 hover:shadow-md hover:border-indigo-200 transition-all duration-200';
                card.onclick = () => loadQuote(no);

                const title = document.createElement('h4');
                title.className = 'text-[12px] font-bold text-gray-800 pr-7 truncate';
                title.innerText = `编号: ${no}`;

                const clientName = document.createElement('p');
                clientName.className = 'text-[11px] text-indigo-900 font-semibold mt-0.5 truncate';
                clientName.innerText = quote.partyB?.name || '未知需方';

                const sub = document.createElement('p');
                sub.className = 'text-[10px] text-gray-400 mt-1 truncate';
                sub.innerText = `保存时间: ${quote.updatedAt || ''}`;

                const delBtn = document.createElement('button');
                delBtn.className = 'absolute right-2 top-2 p-1.5 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity rounded-md hover:bg-red-50 focus:outline-none';
                delBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if(confirm(`确定要删除报价记录【${no}】吗？`)) {
                        delete savedQuotes[no];
                        localStorage.setItem('quote_records', JSON.stringify(savedQuotes));
                        renderSavedContracts(document.getElementById('sidebar-search').value);
                    }
                };

                card.appendChild(title);
                card.appendChild(clientName);
                card.appendChild(sub);
                card.appendChild(delBtn);
                container.appendChild(card);
            });
        }

        function loadQuote(quoteNo) {
            const quote = savedQuotes[quoteNo];
            if (!quote) return;

            switchCompany(quote.companyType || 'sanheyi');
            document.getElementById('quote-no').value = quote.quoteNo || '';
            document.getElementById('quote-date').value = quote.quoteDate || '';
            document.getElementById('bottom-note-text').value = quote.bottomNote || '';

            if (quote.partyB) {
                document.getElementById('partyB_name').value = quote.partyB.name || '';
                document.getElementById('partyB_tax').value = quote.partyB.tax || '';
                document.getElementById('partyB_bank').value = quote.partyB.bank || '';
                document.getElementById('partyB_account').value = quote.partyB.account || '';
                const addrEl = document.getElementById('partyB_address');
                addrEl.value = quote.partyB.address || '';
                adjustTextareaHeight(addrEl);
                document.getElementById('partyB_agent').value = quote.partyB.agent || '';
            }

            if (quote.sealPos) {
                const seal = document.getElementById('partyA_seal');
                seal.style.left = quote.sealPos.left || '480px';
                seal.style.top = quote.sealPos.top || '620px';
            }

            const tbody = document.getElementById('product-tbody');
            tbody.innerHTML = '';

            const items = quote.items && quote.items.length > 0 ? quote.items : [];
            items.forEach(item => {
                if (item.type === 'note') {
                    insertRowHTML(tbody, 'note');
                    const lastRow = tbody.lastElementChild;
                    lastRow.querySelector('.note-input').value = item.content || '';
                } else {
                    insertRowHTML(tbody, 'prod');
                    const lastRow = tbody.lastElementChild;
                    const inputs = lastRow.querySelectorAll('input');
                    inputs[0].value = item.name || '';
                    inputs[1].value = item.code || '';
                    inputs[2].value = item.spec || '';
                    inputs[3].value = item.material || '';
                    inputs[4].value = item.qty || '';
                    inputs[5].value = item.price ? parseFloat(item.price).toFixed(2) : '';
                    inputs[6].value = item.total || '';
                    inputs[7].value = item.remark || '';
                }
            });

            calcTotal();
            updateRowIndices();
            checkBlankRows();
        }

        // ================= 6. 智能识别需方 =================
        function openParseModal() { document.getElementById('parse-modal').classList.remove('hidden'); document.getElementById('parse-modal').classList.add('flex'); }
        function closeParseModal() { document.getElementById('parse-modal').classList.add('hidden'); document.getElementById('parse-modal').classList.remove('flex'); }
        
        function executeParse() {
            const text = document.getElementById('parse-textarea').value;
            if(!text) return closeParseModal();
            const nameMatch = text.match(/(?:公司名称|名称|全称)[:：\s]*([^\n]+)/) || text.match(/^([^\n]+公司)/);
            const taxMatch = text.match(/(?:纳税人识别号|税号|统一社会信用代码)[:：\s]*([a-zA-Z0-9]{15,18})/);
            const bankMatch = text.match(/(?:开户行|行号|银行|开户银行)[:：\s]*([^\n]+)/);
            const accountMatch = text.match(/(?:账号|帐号)[:：\s]*([\d\s\-]{8,})/);
            const addressMatch = text.match(/(?:地址|厂址|公司地址)[:：\s]*([^\n]+)/);
            const phoneMatch = text.match(/(?:电话|联系电话|公司电话|手机)[:：\s]*([0-9\-\s]{7,})/);
            const agentMatch = text.match(/(?:法定代表人|代表人|委托代理人|联系人)[:：\s]*([^\n\s]+)/);

            if(nameMatch) document.getElementById('partyB_name').value = nameMatch[1].trim();
            if(taxMatch) document.getElementById('partyB_tax').value = taxMatch[1].trim();
            if(bankMatch) document.getElementById('partyB_bank').value = bankMatch[1].trim();
            if(accountMatch) document.getElementById('partyB_account').value = accountMatch[1].replace(/\s/g,'').trim();
            if(addressMatch) {
                const bAddrEl = document.getElementById('partyB_address');
                bAddrEl.value = addressMatch[1].trim();
                adjustTextareaHeight(bAddrEl);
            }
            let agentStr = "";
            if(agentMatch) agentStr += agentMatch[1].trim() + " ";
            if(phoneMatch) agentStr += phoneMatch[1].trim();
            document.getElementById('partyB_agent').value = agentStr.trim();
            
            saveCurrentClient();
            document.getElementById('parse-textarea').value = '';
            closeParseModal();
        }

        // ================= 7. 表格增减与智能填充 =================
        function formatDecimal(input) {
            if (input.value !== '' && !isNaN(parseFloat(input.value))) {
                input.value = parseFloat(input.value).toFixed(2);
            }
        }

        function insertRowHTML(parent, type, insertAfterNode = null) {
            const tr = document.createElement('tr');
            tr.className = `item-row ${type}-row group relative h-7`;

            const actionsHTML = `
                <div class="absolute -right-[4.5rem] top-0 hidden group-hover:flex no-print gap-1 z-10">
                    <button type="button" onclick="addRow(this, 'prod')" class="bg-blue-500 text-white px-1 h-5 flex items-center justify-center rounded-sm shadow text-[10px] hover:bg-blue-600">+产品</button>
                    <button type="button" onclick="addRow(this, 'note')" class="bg-orange-500 text-white px-1 h-5 flex items-center justify-center rounded-sm shadow text-[10px] hover:bg-orange-600">+说明</button>
                    <button type="button" onclick="removeRow(this)" class="bg-red-500 text-white px-1 h-5 flex items-center justify-center rounded-sm shadow text-[10px] hover:bg-red-600">删</button>
                </div>
            `;

            if (type === 'prod') {
                tr.innerHTML = `
                    <td class="p-0 row-index bg-gray-50 text-gray-500 font-medium"></td>
                    <td class="p-0"><input type="text" class="name-input w-full h-full px-1 text-center focus:outline-none focus:bg-yellow-50"></td>
                    <td class="p-0"><input type="text" class="w-full h-full px-1 text-center focus:outline-none focus:bg-yellow-50"></td>
                    <td class="p-0"><input type="text" class="w-full h-full px-1 text-center focus:outline-none focus:bg-yellow-50"></td>
                    <td class="p-0"><input type="text" class="w-full h-full px-1 text-center focus:outline-none focus:bg-yellow-50"></td>
                    <td class="p-0"><input type="number" class="qty w-full h-full px-1 text-center focus:outline-none focus:bg-yellow-50" oninput="calcTotal()"></td>
                    <td class="p-0"><input type="number" step="0.01" class="price w-full h-full px-1 text-center focus:outline-none focus:bg-yellow-50" oninput="calcTotal()" onblur="formatDecimal(this)"></td>
                    <td class="p-0"><input type="text" class="row-total w-full h-full px-1 text-center font-bold text-gray-700 bg-gray-50 focus:outline-none" readonly tabindex="-1"></td>
                    <td class="p-0 relative">
                        <input type="text" class="w-full h-full px-1 text-center focus:outline-none focus:bg-yellow-50">
                        ${actionsHTML}
                    </td>
                `;
            } else {
                tr.innerHTML = `
                    <td class="p-0 row-index bg-gray-50 text-gray-500 font-medium"></td>
                    <td class="p-0" colspan="6"><input type="text" class="note-input w-full h-full px-2 text-center text-blue-800 focus:outline-none focus:bg-yellow-50" placeholder="在此输入合并说明(如:含模具费XXX元)"></td>
                    <td class="p-0 bg-gray-50"></td>
                    <td class="p-0 relative bg-gray-50">
                        ${actionsHTML}
                    </td>
                `;
            }

            if (insertAfterNode) {
                insertAfterNode.after(tr);
            } else {
                parent.appendChild(tr);
            }

            // 给新生成的行绑定 Excel 行高拖拽手柄
            attachRowResizer(tr);
        }

        function updateRowIndices() {
            const rows = document.querySelectorAll('#product-tbody .item-row');
            rows.forEach((row, idx) => {
                row.querySelector('.row-index').innerText = idx + 1;
            });
            document.getElementById('bottom-note-index').innerText = rows.length + 1;
        }

        function addRow(btn, type) {
            const tr = btn.closest('tr');
            insertRowHTML(null, type, tr);
            updateRowIndices();
            checkBlankRows();
            
            const newTr = tr.nextElementSibling;
            const focusInput = newTr.querySelector('.name-input') || newTr.querySelector('.note-input');
            if(focusInput) focusInput.focus();
        }

        function removeRow(btn) {
            const tbody = document.getElementById('product-tbody');
            if(tbody.querySelectorAll('.item-row').length <= 1) {
                alert("至少保留一行明细！"); return;
            }
            btn.closest('tr').remove();
            calcTotal();
            updateRowIndices();
            checkBlankRows();
        }

        function checkBlankRows() {
            const rows = Array.from(document.querySelectorAll('#product-tbody .item-row'));
            let lastContentIndex = -1;

            rows.forEach((row, index) => {
                let hasContent = false;
                
                if (row.classList.contains('prod-row')) {
                    const inputs = row.querySelectorAll('input:not(.row-total)');
                    inputs.forEach(input => {
                        if (input.classList.contains('name-input') && input.value === '以下空白') return; 
                        if (input.value.trim() !== '') hasContent = true;
                    });
                } else if (row.classList.contains('note-row')) {
                    const noteInp = row.querySelector('.note-input');
                    if (noteInp && noteInp.value.trim() !== '') hasContent = true;
                }
                
                let isFocused = row.contains(document.activeElement);
                if (hasContent || isFocused) { lastContentIndex = index; }
            });

            if (lastContentIndex === rows.length - 1) {
                insertRowHTML(document.getElementById('product-tbody'), 'prod');
                updateRowIndices();
                setTimeout(checkBlankRows, 10); 
                return; 
            }

            rows.forEach((row, index) => {
                if (row.classList.contains('prod-row')) {
                    const nameInput = row.querySelector('.name-input');
                    if (lastContentIndex >= 0 && index === lastContentIndex + 1) {
                        if (nameInput.value === '') nameInput.value = '以下空白';
                    } else {
                        if (nameInput.value === '以下空白') nameInput.value = '';
                    }
                }
            });
        }

        const tbody = document.getElementById('product-tbody');
        tbody.addEventListener('input', checkBlankRows);
        tbody.addEventListener('focusin', checkBlankRows);
        tbody.addEventListener('focusout', () => setTimeout(checkBlankRows, 10));

        // ================= 8. 自动金额推算 =================
        function calcTotal() {
            let grandTotal = 0;
            document.querySelectorAll('.prod-row').forEach(row => {
                const qty = parseFloat(row.querySelector('.qty').value) || 0;
                const price = parseFloat(row.querySelector('.price').value) || 0;
                const totalInput = row.querySelector('.row-total');
                const rowTotal = qty * price;
                if(rowTotal > 0) { 
                    totalInput.value = rowTotal.toFixed(2); 
                    grandTotal += rowTotal; 
                } else { 
                    totalInput.value = ''; 
                }
            });
            
            document.getElementById('grand-total-num').value = grandTotal > 0 ? `(¥ ${grandTotal.toFixed(2)})` : '';
            document.getElementById('grand-total-cn').innerText = grandTotal > 0 ? amountToChinese(grandTotal) : '零元整';
        }

        function amountToChinese(n) {
            const fraction =['角', '分'];
            const digit =['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
            const unit = [['元', '万', '亿'],['', '拾', '佰', '仟']];
            const head = n < 0 ? '欠' : '';
            n = Math.abs(n); let s = '';
            for (let i = 0; i < fraction.length; i++) s += (digit[Math.floor(n * 10 * Math.pow(10, i)) % 10] + fraction[i]).replace(/零./, '');
            s = s || '整'; n = Math.floor(n);
            for (let i = 0; i < unit[0].length && n > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && n > 0; j++) { p = digit[n % 10] + unit[1][j] + p; n = Math.floor(n / 10); }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }
            return head + s.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零').replace(/^整$/, '零元整');
        }

        // ================= 9. 导出 PDF =================
        function downloadPDF() {
            saveCurrentQuote();

            window.scrollTo(0, 0); 
            const element = document.getElementById('quote-content');
            
            const inputs = element.querySelectorAll('input');
            const textareas = element.querySelectorAll('textarea');
            inputs.forEach(input => { input.setAttribute('data-placeholder', input.placeholder || ''); input.placeholder = ''; input.setAttribute('value', input.value); });
            textareas.forEach(textarea => { textarea.setAttribute('data-placeholder', textarea.placeholder || ''); textarea.placeholder = ''; textarea.textContent = textarea.value; });

            const btn = document.getElementById('pdf-btn');
            const originalText = btn.innerHTML; btn.innerHTML = '正在生成...';

            const partyAName = document.getElementById('partyA_name').value || '公司';
            const quoteNo = document.getElementById('quote-no').value;

            html2pdf().set({
                margin: 0, 
                filename: `${partyAName}_${quoteNo}_报价单.pdf`,
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { scale: 2, useCORS: true, scrollY: 0, backgroundColor: '#ffffff' }, 
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save().then(() => {
                btn.innerHTML = originalText;
                inputs.forEach(input => { input.placeholder = input.getAttribute('data-placeholder'); });
                textareas.forEach(textarea => { textarea.placeholder = textarea.getAttribute('data-placeholder'); });
            });
        }
    </script>
