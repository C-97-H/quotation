<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统报价单</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: "SimSun", "Songti SC", "STSong", "Times New Roman", serif;
            margin: 0;
            padding: 0;
            user-select: none;
            overflow-x: hidden;
        }
        .a4-paper {
            width: 210mm;
            min-height: 297mm; 
            margin: 20px auto;
            background-color: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 12mm 15mm; 
            box-sizing: border-box;
            position: relative;
        }
        
        /* 表格线宽与绝对固定布局 */
        .box-table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
        }
        .box-table th, .box-table td {
            border: 1px solid #4b5563 !important; 
            position: relative;
            word-break: break-all;
        }

        .box-table td:last-child {
            overflow: visible !important;
        }

        input, textarea {
            background-color: transparent;
            color: #111827;
            user-select: text;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* 公章样式：鼠标可按住拖拽 */
        .realistic-stamp {
            mix-blend-mode: multiply;
            cursor: move;
            user-select: none;
            position: absolute;
            z-index: 30;
            transition: transform 0.05s ease;
        }
        .realistic-stamp:active {
            opacity: 0.85;
            cursor: grabbing;
        }

        /* Excel 风格列宽/行高拖拽手柄 */
        .col-resizer {
            position: absolute;
            top: 0;
            right: -3px;
            width: 6px;
            height: 100%;
            cursor: col-resize;
            z-index: 40;
        }
        .col-resizer:hover, .col-resizer.resizing {
            background-color: #3b82f6;
        }

        .row-resizer {
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100%;
            height: 6px;
            cursor: row-resize;
            z-index: 40;
        }
        .row-resizer:hover, .row-resizer.resizing {
            background-color: #3b82f6;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            body { background: white; margin: 0; padding: 0; }
            .no-print, .col-resizer, .row-resizer { display: none !important; }
            input::placeholder, textarea::placeholder { color: transparent !important; }
            .a4-paper { box-shadow: none; margin: 0; width: 100%; min-height: 100%; padding: 10mm; }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>
<body class="text-gray-900 bg-gray-100">

    <!-- 顶部固定操作栏 -->
    <div class="no-print fixed top-0 w-full h-[60px] bg-gray-800 z-50 shadow-md flex items-center justify-between px-6">
        <div class="flex items-center gap-3">
            <h1 class="text-white font-bold text-base tracking-wider mr-2">报价单管理系统</h1>
            <div class="flex bg-gray-700 rounded overflow-hidden shadow-sm">
                <button id="btn-company-sanheyi" onclick="switchCompany('sanheyi')" class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition border-r border-indigo-800">
                    三合一 (专票)
                </button>
                <button id="btn-company-huixinfa" onclick="switchCompany('huixinfa')" class="px-3 py-1.5 bg-slate-600 text-white text-xs font-bold hover:bg-slate-500 transition">
                    惠新发 (普票)
                </button>
            </div>
            <span class="text-xs text-amber-300 bg-amber-950/60 px-2.5 py-1 rounded border border-amber-700/50 flex items-center">
                💡 公章可自由拖拽；表格线可拉动微调宽高
            </span>
        </div>
        <div class="flex items-center gap-2.5">
            <button onclick="createNewQuote()" class="px-3 py-1.5 bg-gray-700 text-gray-200 text-xs font-bold rounded shadow-sm hover:bg-gray-600 transition flex items-center">
                新建清空
            </button>
            <button onclick="openParseModal()" class="px-3 py-1.5 bg-fuchsia-600 text-white text-xs font-bold rounded shadow-sm hover:bg-fuchsia-700 transition flex items-center">
                <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                识别需方资料
            </button>
            <button onclick="manualSaveQuote()" class="px-3.5 py-1.5 bg-amber-600 text-white text-xs font-bold rounded shadow-sm hover:bg-amber-700 transition flex items-center">
                保存报价
            </button>
            <button onclick="window.print()" class="px-3.5 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded shadow-sm hover:bg-emerald-700 transition flex items-center">
                直接打印
            </button>
            <button onclick="downloadPDF()" id="pdf-btn" class="px-4 py-1.5 bg-blue-600 text-white text-xs font-bold rounded shadow-sm hover:bg-blue-700 transition flex items-center">

        </div>
    </div>

    <!-- 左侧侧边栏 -->
    <aside class="no-print fixed left-0 top-[60px] bottom-0 w-[280px] bg-white shadow-[4px_0_24px_rgba(0,0,0,0.04)] border-r border-gray-200 z-40 flex flex-col">
        <div class="flex border-b border-gray-200 bg-gray-50 text-xs font-bold">
            <button id="tab-clients-btn" onclick="switchSidebarTab('clients')" class="flex-1 py-3 text-center text-indigo-600 border-b-2 border-indigo-600 bg-white transition">
                客户库 (<span id="history-count">0</span>)
            </button>
            <button id="tab-contracts-btn" onclick="switchSidebarTab('contracts')" class="flex-1 py-3 text-center text-gray-500 hover:text-indigo-600 transition border-b-2 border-transparent">
                历史报价 (<span id="contract-count">0</span>)
            </button>
        </div>
        
        <div class="p-3 border-b border-gray-100">
            <div class="relative">
                <input type="text" id="sidebar-search" oninput="handleSidebarSearch()" placeholder="搜索客户名或报价单号..." class="w-full bg-gray-100 text-xs rounded-md pl-8 pr-3 py-2 focus:outline-none focus:ring-1 focus:ring-indigo-400 focus:bg-white transition">
                <svg class="w-4 h-4 text-gray-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <div class="p-3 border-t border-gray-100 bg-white">
            <button onclick="openParseModal()" class="w-full py-2 bg-fuchsia-50 text-fuchsia-700 border border-fuchsia-200 rounded-lg text-xs font-bold hover:bg-fuchsia-600 hover:text-white transition flex justify-center items-center group">
                <svg class="w-4 h-4 mr-1.5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                粘贴新需方资料
            </button>
        </div>
    </aside>

    <!-- 右侧报价单主区域 -->
    <main class="ml-[280px] pt-[60px] pb-10 print:ml-0 print:pt-0 print:pb-0 overflow-x-auto">
        <div id="quote-content" class="a4-paper flex flex-col bg-white">
            
            <h1 class="text-3xl font-bold text-center tracking-[0.8em] mb-4 text-gray-900">报 价 单</h1>

                        </td>

                        </td>

                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="px-2 py-1 align-top z-0 relative">
                            <div class="flex"><span class="w-[4.5rem]">开户行：</span><input type="text" id="partyA_bank" class="flex-1 focus:outline-none"></div>
                        </td>
                        <td colspan="5" class="px-2 py-1 align-top">

                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="px-2 py-1 align-top z-0 relative">
                            <div class="flex"><span class="w-[4.5rem]">公司帐号：</span><input type="text" id="partyA_account" class="flex-1 focus:outline-none font-sans"></div>
                        </td>
                        <td colspan="5" class="px-2 py-1 align-top">
                            <div class="flex"><span class="w-[4.5rem]">公司帐号：</span><input type="text" id="partyB_account" class="flex-1 focus:outline-none font-sans"></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="px-2 py-1 align-top z-0 relative">
                            <div class="flex"><span class="w-[4.5rem]">联系人：</span><input type="text" id="partyA_agent" class="flex-1 focus:outline-none"></div>
                        </td>

                            <div class="flex"><span class="w-[4.5rem]">联系人：</span><input type="text" id="partyB_agent" class="flex-1 focus:outline-none"></div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="px-2 py-1 align-top z-0 relative">
                            <div class="flex items-start"><span class="w-[4.5rem] mt-[1px]">公司地址：</span><textarea id="partyA_address" rows="1" oninput="adjustTextareaHeight(this)" class="flex-1 focus:outline-none resize-none overflow-hidden p-0 bg-transparent"></textarea></div>

                        <td colspan="5" class="px-2 py-1 align-top">
                            <div class="flex items-start"><span class="w-[4.5rem] mt-[1px]">公司地址：</span><textarea id="partyB_address" rows="1" oninput="adjustTextareaHeight(this)" class="flex-1 focus:outline-none resize-none overflow-hidden p-0 bg-transparent"></textarea></div>

            <!-- 公章图片 (支持跨域预览及拖拽) -->

    <!-- 智能识别需方资料弹窗 -->
    <div id="parse-modal" class="fixed inset-0 z-50 bg-black/60 hidden items-center justify-center no-print backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-[90%] max-w-lg flex flex-col overflow-hidden">
            <div class="px-5 py-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="text-sm font-bold text-gray-800">智能识别需方(乙方)开票资料</h3>
                <button onclick="closeParseModal()" class="text-gray-400 hover:text-red-500"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="p-4">
                <p class="text-xs text-gray-500 mb-2">可直接从微信、邮件复制客户开票抬头、税号、银行信息粘贴在下方：</p>
                <textarea id="parse-textarea" rows="6" class="w-full border border-gray-300 rounded p-3 text-xs focus:outline-none focus:border-fuchsia-500 leading-relaxed" placeholder="示例：&#10;名称：东莞市示例五金科技有限公司&#10;税号：91441900MA5XXXXXX&#10;开户行及账号：建行东莞支行 4405018655...&#10;地址电话：东莞市塘厦镇... 0769-88888888"></textarea>
            </div>
            <div class="px-4 py-3 border-t bg-gray-50 flex justify-end gap-2.5">
                <button onclick="closeParseModal()" class="px-4 py-2 border rounded-lg text-gray-600 bg-white hover:bg-gray-100 text-xs">取消</button>
                <button onclick="executeParse()" class="px-4 py-2 bg-fuchsia-600 text-white rounded-lg hover:bg-fuchsia-700 text-xs font-bold shadow-md">一键识别填入</button>
            </div>
        </div>
    </div>

    <script>
        function adjustTextareaHeight(el) {
            if (!el) return;
            el.style.height = 'auto'; 
            el.style.height = Math.max(el.scrollHeight, 18) + 'px'; 
        }

        let currentCompanyType = 'sanheyi';

        // 1. 供方预设配置
        const companyData = {
            sanheyi: {
                name: '深圳市三合一五金有限公司',
                tax: '91440300306115994W',
                bank: '中国工商银行深圳双龙支行',
                account: '4000020609201024351',
                agent: '蔡国贵 13824361177',
                address: '深圳市龙岗区高科大道56号万达科技园1号厂房',
                priceHeaderHtml: '含13%税<br>单价',
                showSeal: true,
                sealSrc: './shy.png'
            },
            huixinfa: {
                name: '深圳市龙岗区惠新发五金钢材商行',
                tax: '92440300L375629906',
                bank: '深圳农村商业银行南约支行',
                account: '000106704608',
                agent: '蔡国贵 13824361177',
                address: '深圳市龙岗区宝龙街道高科大道万达科技园56号1号厂房',
                priceHeaderHtml: '单价',
                showSeal: true,
                sealSrc: './hxf.png'
            }
        };

        function switchCompany(type) {
            currentCompanyType = type;
            const data = companyData[type];

            const btnSanheyi = document.getElementById('btn-company-sanheyi');
            const btnHuixinfa = document.getElementById('btn-company-huixinfa');
            if (type === 'sanheyi') {
                btnSanheyi.className = 'px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition border-r border-indigo-800';
                btnHuixinfa.className = 'px-3 py-1.5 bg-slate-600 text-white text-xs font-bold hover:bg-slate-500 transition';
            } else {
                btnHuixinfa.className = 'px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition';
                btnSanheyi.className = 'px-3 py-1.5 bg-slate-600 text-white text-xs font-bold hover:bg-slate-500 transition border-r border-indigo-800';
            }

            document.getElementById('partyA_name').value = data.name;
            document.getElementById('partyA_tax').value = data.tax;
            document.getElementById('partyA_bank').value = data.bank;
            document.getElementById('partyA_account').value = data.account;
            document.getElementById('partyA_agent').value = data.agent;
            
            const addrEl = document.getElementById('partyA_address');
            addrEl.value = data.address;
            adjustTextareaHeight(addrEl);
            
            document.getElementById('th-price').innerHTML = data.priceHeaderHtml;
            
            const sealImg = document.getElementById('partyA_seal');
            if (data.showSeal) {
                sealImg.src = data.sealSrc;
                sealImg.style.display = 'block';
            } else {
                sealImg.style.display = 'none';
            }
        }

        // 2. 列宽与印章拖动
        function initExcelDragFeatures() {
            const table = document.getElementById('quote-table');
            const headers = Array.from(table.querySelectorAll('thead th'));

            headers.slice(0, headers.length - 1).forEach((th, index) => {
                const nextTh = headers[index + 1];
                if (!nextTh || th.querySelector('.col-resizer')) return;

                const resizer = document.createElement('div');
                resizer.className = 'col-resizer no-print';
                th.appendChild(resizer);

                let startX = 0, startWidth = 0, nextStartWidth = 0;

                resizer.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    startX = e.clientX;
                    startWidth = th.offsetWidth;
                    nextStartWidth = nextTh.offsetWidth;
                    resizer.classList.add('resizing');

                    const onMouseMove = (moveEvent) => {
                        const deltaX = moveEvent.clientX - startX;
                        const minWidth = 25; 

                        let newWidth = startWidth + deltaX;
                        let newNextWidth = nextStartWidth - deltaX;

                        if (newWidth >= minWidth && newNextWidth >= minWidth) {
                            th.style.width = `${newWidth}px`;
                            nextTh.style.width = `${newNextWidth}px`;
                        }
                    };

                    const onMouseUp = () => {
                        resizer.classList.remove('resizing');
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    };

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            });

            initStampDrag();
        }

        function initStampDrag() {
            const seal = document.getElementById('partyA_seal');
            const container = document.getElementById('quote-content');
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            seal.addEventListener('mousedown', (e) => {
                e.preventDefault();
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = seal.offsetLeft;
                initialTop = seal.offsetTop;

                const onMouseMove = (moveEvent) => {
                    if (!isDragging) return;
                    const dx = moveEvent.clientX - startX;
                    const dy = moveEvent.clientY - startY;

                    const containerWidth = container.offsetWidth;
                    const containerHeight = container.offsetHeight;
                    const sealWidth = seal.offsetWidth || 155;
                    const sealHeight = seal.offsetHeight || 155;

                    let newLeft = Math.max(0, Math.min(initialLeft + dx, containerWidth - sealWidth));
                    let newTop = Math.max(0, Math.min(initialTop + dy, containerHeight - sealHeight));

                    seal.style.left = `${newLeft}px`;
                    seal.style.top = `${newTop}px`;
                };

                const onMouseUp = () => {
                    isDragging = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        function initDateAndNo() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hour = String(now.getHours()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');

        // 5. 智能解析需方资料
        function openParseModal() { document.getElementById('parse-modal').classList.remove('hidden'); document.getElementById('parse-modal').classList.add('flex'); }
        function closeParseModal() { document.getElementById('parse-modal').classList.add('hidden'); document.getElementById('parse-modal').classList.remove('flex'); }
        
        function executeParse() {
            const text = document.getElementById('parse-textarea').value;
            if(!text) return closeParseModal();

            const nameMatch = text.match(/(?:公司名称|名称|全称|单位名称)[:：\s]*([^\n\r]+)/) || text.match(/^([^\n\r]+(?:公司|商行|企业|厂|店))/m);
            const taxMatch = text.match(/(?:纳税人识别号|税号|统一社会信用代码)[:：\s]*([a-zA-Z0-9]{15,18})/);
            
            // 兼容“开户行及账号：建行东莞支行 44050186...”这种复合写法
            const bankAccountCombined = text.match(/(?:开户行及账号|开户银行及账号|银行账号)[:：\s]*([^\n\r]+)/);
            let bank = "", account = "";
            if (bankAccountCombined) {
                const parts = bankAccountCombined[1].trim().split(/\s+/);
                if (parts.length >= 2) {
                    bank = parts[0];
                    account = parts.slice(1).join('').replace(/[\s-]/g, '');
                } else {
                    account = parts[0].replace(/[\s-]/g, '');
                }
            }

            if (!bank) {
                const bankMatch = text.match(/(?:开户行|行号|银行|开户银行)[:：\s]*([^\n\r]+)/);
                if (bankMatch) bank = bankMatch[1].trim();
            }
            if (!account) {
                const accountMatch = text.match(/(?:账号|帐号)[:：\s]*([\d\s\-]{8,})/);
                if (accountMatch) account = accountMatch[1].replace(/\s/g,'').trim();
            }

            // 兼容“地址、电话：东莞市... 0769-...”这种写法
            let address = "", phone = "", agent = "";
            const addrPhoneCombined = text.match(/(?:地址、电话|地址及电话|公司地址电话)[:：\s]*([^\n\r]+)/);
            if (addrPhoneCombined) {
                const parts = addrPhoneCombined[1].trim().split(/\s+/);
                if (parts.length >= 2) {
                    phone = parts[parts.length - 1];
                    address = parts.slice(0, -1).join(' ');
                } else {
                    address = parts[0];
                }
            }

            if (!address) {
                const addressMatch = text.match(/(?:地址|厂址|公司地址)[:：\s]*([^\n\r]+)/);
                if (addressMatch) address = addressMatch[1].trim();
            }
            if (!phone) {
                const phoneMatch = text.match(/(?:电话|联系电话|公司电话|手机)[:：\s]*([0-9\-\s]{7,})/);
                if (phoneMatch) phone = phoneMatch[1].trim();
            }

            const agentMatch = text.match(/(?:法定代表人|代表人|委托代理人|联系人)[:：\s]*([^\n\r\s]+)/);
            if (agentMatch) agent = agentMatch[1].trim();

            if (nameMatch) document.getElementById('partyB_name').value = nameMatch[1].trim();
            if (taxMatch) document.getElementById('partyB_tax').value = taxMatch[1].trim();
            if (bank) document.getElementById('partyB_bank').value = bank;
            if (account) document.getElementById('partyB_account').value = account;
            if (address) {
                const bAddrEl = document.getElementById('partyB_address');
                bAddrEl.value = address;
                adjustTextareaHeight(bAddrEl);
            }
            let agentStr = (agent + " " + phone).trim();
            if (agentStr) document.getElementById('partyB_agent').value = agentStr;
            
            saveCurrentClient();
            document.getElementById('parse-textarea').value = '';
            closeParseModal();
        }

        // 7. 金额自动计算与高精度中文大写转换
        function calcTotal() {
            let grandTotal = 0;
            document.querySelectorAll('.prod-row').forEach(row => {
                const qtyVal = row.querySelector('.qty').value.trim();
                const priceVal = row.querySelector('.price').value.trim();
                const totalInput = row.querySelector('.row-total');
                
                if(qtyVal !== '' && priceVal !== '' && !isNaN(qtyVal) && !isNaN(priceVal)) {
                    const qty = parseFloat(qtyVal);
                    const price = parseFloat(priceVal);
                    const rowTotal = Math.round(qty * price * 100) / 100;
                    totalInput.value = rowTotal.toFixed(2); 
                    grandTotal += rowTotal; 
                } else { 
                    totalInput.value = ''; 
                }
            });
            
            grandTotal = Math.round(grandTotal * 100) / 100;
            document.getElementById('grand-total-num').value = grandTotal !== 0 ? `(¥ ${grandTotal.toFixed(2)})` : '';
            document.getElementById('grand-total-cn').innerText = grandTotal !== 0 ? amountToChinese(grandTotal) : '零元整';
        }

        // 标准人民币大写金额转换算法（彻底解决角分截断与零的连写问题）
        function amountToChinese(amount) {
            if (isNaN(amount) || amount === 0) return '零元整';
            
            const cnDigits = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
            const cnUnits = ['', '拾', '佰', '仟'];
            const cnBigUnits = ['', '万', '亿', '兆'];
            const cnDecUnits = ['角', '分'];
            
            let prefix = amount < 0 ? '负' : '';
            amount = Math.abs(amount);
            
            // 拆分整数与小数，做四舍五入
            let integral = Math.floor(Math.round(amount * 100) / 100);
            let decimal = Math.round((amount - integral) * 100);
            
            let output = '';
            
            if (integral > 0) {
                let zeroCount = 0;
                let intStr = integral.toString();
                let len = intStr.length;
                let bigUnitIndex = 0;
                
                for (let i = 0; i < len; i += 4) {
                    let section = intStr.slice(Math.max(0, len - i - 4), len - i);
                    let sectionStr = '';
                    let secZero = 0;
                    
                    for (let j = 0; j < section.length; j++) {
                        let num = parseInt(section[j]);
                        let unitIdx = section.length - 1 - j;
                        
                        if (num === 0) {
                            secZero++;
                        } else {
                            if (secZero > 0) {
                                sectionStr += cnDigits[0];
                                secZero = 0;
                            }
                            sectionStr += cnDigits[num] + cnUnits[unitIdx];
                        }
                    }
                    
                    if (sectionStr !== '') {
                        output = sectionStr + cnBigUnits[bigUnitIndex] + output;
                    }
                    bigUnitIndex++;
                }
                output += '元';
            }
            
            if (decimal > 0) {
                let jiao = Math.floor(decimal / 10);
                let fen = decimal % 10;
                
                if (jiao > 0) {
                    output += cnDigits[jiao] + cnDecUnits[0];
                } else if (integral > 0 && fen > 0) {
                    output += cnDigits[0];
                }
                
                if (fen > 0) {
                    output += cnDigits[fen] + cnDecUnits[1];
                }
            } else {
                output += '整';
            }
            
            return prefix + output;
        }

        // 8. 导出 PDF
        function downloadPDF() {
            saveCurrentQuote();
            window.scrollTo(0, 0); 
            
            const element = document.getElementById('quote-content');
            const inputs = element.querySelectorAll('input');
            const textareas = element.querySelectorAll('textarea');
            
            inputs.forEach(input => { 
                input.setAttribute('data-placeholder', input.placeholder || ''); 
                input.placeholder = ''; 
                input.setAttribute('value', input.value); 
            });
            textareas.forEach(textarea => { 
                textarea.setAttribute('data-placeholder', textarea.placeholder || ''); 
                textarea.placeholder = ''; 
                textarea.textContent = textarea.value; 
            });

            const btn = document.getElementById('pdf-btn');
            const originalText = btn.innerHTML; 
            btn.innerHTML = '正在生成...';

            const partyAName = document.getElementById('partyA_name').value || '报价单';
            const quoteNo = document.getElementById('quote-no').value;

            const opt = {
                margin: [0, 0, 0, 0],
                filename: `${partyAName}_${quoteNo}.pdf`,
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { 
                    scale: 2.5, 
                    useCORS: true, 
                    scrollY: 0, 
                    backgroundColor: '#ffffff'
                }, 
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
                inputs.forEach(input => { input.placeholder = input.getAttribute('data-placeholder'); });
                textareas.forEach(textarea => { textarea.placeholder = textarea.getAttribute('data-placeholder'); });
            }).catch(err => {
                btn.innerHTML = originalText;
                console.error(err);
                alert('PDF 导出失败，请尝试使用“直接打印”另存为 PDF');
            });
        }
    </script>
